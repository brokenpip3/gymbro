complexity:
  LongMethod:
    threshold: 100
  LongParameterList:
    functionThreshold: 9
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInInterfaces: 12

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    excludes:
      - '**/src/test/**'
